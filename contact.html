<!-- Brew & Bloom Coffee — Contact Page -->
<!DOCTYPE html>
<html lang="en">

<!-- Head: metadata, title (not visible on the page) -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Get in touch with Brew & Bloom Coffee. Send us a
            message with questions, feedback, or orders.">
    <title>Contact Us</title>
</head>

<!-- Body: everything the user sees on the page -->
<body>
    <!-- Header + navigation menu (appears at the top of every page) -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main: unique content for the Contact page -->
    <main>
        <!-- Contact form section: collects name, email, and message -->
        <section>
            <h1>Contact Brew & Bloom</h1>
            <!-- Form sends data to "#" (placeholder — replace with real backend later) -->
            <form action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <!-- Footer with copyright (appears at the bottom of every page) -->
    <footer>
        <p>&copy; 2026 Brew & Bloom Coffee. All rights reserved.</p>
    </footer>
</body>

</html>
